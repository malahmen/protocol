name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax of every module
        # Globbed, not listed: a named list quietly stops covering the next
        # module somebody adds.
        run: python3 -m compileall -q protocol tests

      - name: tests, stdlib only
        # The contract's suite needs nothing installed; the HTTP tests skip.
        # Run first so a stray third-party import in the core fails here.
        run: python3 -m unittest discover -s tests -v

      - name: install
        run: python3 -m pip install -r requirements-dev.txt

      - name: tests, with the HTTP layer
        run: python3 -m unittest discover -s tests -v

  redis:
    # The queue, the completion stream and the guarded worker against a real
    # Redis 7 - the major meksha runs (kuat's redis_version). The suite flushes
    # the database it is given, so it gets this throwaway one and nothing else;
    # without PROTOCOL_TEST_REDIS_URL those checks skip.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: python3 -m pip install -r requirements-dev.txt

      - name: tests, with Redis
        env:
          PROTOCOL_TEST_REDIS_URL: redis://localhost:6379/15
        run: python3 -m unittest discover -s tests -v

  storage:
    # The stores, the registry and the index against real Garage, MariaDB and
    # Qdrant - started by tests/backends/up.sh, the same script a developer
    # runs, at the versions the homelab runs (kuat's mariadb_version and
    # qdrant_version for meksha; taris's Garage, v2.4.1). The suite empties what it is pointed at, so it gets
    # these throwaway ones and nothing else; without the variables those
    # checks skip. With them, test_service.py also runs again on top of them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: python3 -m pip install -r requirements-dev.txt

      - name: start Garage, Qdrant and MariaDB
        # up.sh prints `export NAME=value` lines; GITHUB_ENV takes NAME=value.
        shell: bash
        run: ENGINE=docker tests/backends/up.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: tests, with the storage backends
        run: python3 -m unittest discover -s tests -v

      - name: the backends' logs, if anything failed
        if: failure()
        run: for c in garage qdrant mariadb; do docker logs "protocol-test-$c" 2>&1 | tail -40; done

  image:
    # The Containerfile builds, and the image runs protocol.deploy: its check
    # reports every backend by name and fails, with none to reach.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -t protocol:ci .

      - name: check, with no backends
        shell: bash
        run: |
          set +e
          out="$(docker run --rm protocol:ci check)"; rc=$?
          echo "$out"
          [[ $rc -eq 1 ]] && grep -q "FAIL  MariaDB" <<< "$out" && grep -q "FAIL  Qdrant" <<< "$out"
